[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Lean, deterministic set: pyflakes (F), pycodestyle errors (E), import sort (I).
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: test needs a running PostgreSQL + pgvector (no LLM API).",
    "eval: RAG eval gate; needs Azure OpenAI configured (LLM + embeddings).",
]
