# Template for the app's secrets. Copy to k8s/secret.yaml (git-ignored), fill in
# real values, and apply it — OR create the same Secret imperatively from your
# .env (see k8s/README.md). Never commit real keys.
#
# NOTE: for a minimal teaching setup everything lives in one Secret. In a real
# system the non-sensitive values (API version, deployment names, EMBEDDING_DIM,
# host, DB name) would go in a ConfigMap instead.
apiVersion: v1
kind: Secret
metadata:
  name: qna-secrets
type: Opaque
stringData:
  # --- Azure OpenAI ---
  AZURE_OPENAI_ENDPOINT: "https://<your-resource>.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "<your-azure-openai-key>"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_CHAT_DEPLOYMENT: "gpt-5-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  EMBEDDING_DIM: "1536"

  # --- Database: the API talks to the in-cluster postgres Service by name ---
  DATABASE_URL: "postgresql://postgres:postgres@qna-postgres:5432/qna-database"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "qna-database"

  # --- Langfuse (optional; leave blank to disable tracing) ---
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_HOST: "https://cloud.langfuse.com"
